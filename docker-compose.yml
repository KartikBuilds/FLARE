services:
  analyzer:
    # Forced to amd64: official solc static Linux builds (and some Foundry
    # release assets) are far more reliably available for x86_64 than
    # native linux/arm64, and running a *consistently* emulated container
    # (via Rosetta/QEMU on Apple Silicon hosts) avoids the partial-arch
    # mismatches that come from letting individual tools pick their own
    # binary architecture inside an arm64 container.
    platform: linux/amd64
    build:
      context: ./services/analyzer
    ports:
      - "8000:8000"
    volumes:
      - ./services/analyzer:/srv/analyzer
      - analyzer-data:/srv/analyzer/data
      - ./contracts:/srv/contracts
      - ./evaluation:/srv/evaluation
    environment:
      - FLARE_WORKSPACE_DIR=/srv/analyzer/workspaces
      - FLARE_DB_PATH=/srv/analyzer/data/flare.db
      - FLARE_AI_PROVIDER=disabled
    # Never expose the analyzer's uploaded/compiled workspaces to a public
    # network — this service is intended for local development and CI only.

  cross-tool-eval:
    # RO3 comparative evaluation (Slither CLI + Mythril) — a separate image
    # from `analyzer` on purpose; see the Dockerfile comment. Not part of
    # the running product, only `docker compose run --rm cross-tool-eval
    # ...` for research/evaluation — see evaluation/CROSS_TOOL_EVALUATION.md.
    platform: linux/amd64
    build:
      context: ./evaluation/cross_tool
    volumes:
      - ./contracts:/srv/contracts
      - ./evaluation:/srv/evaluation

volumes:
  analyzer-data:
